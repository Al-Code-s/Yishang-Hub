# 意尚智造集成平台 Nginx 站点配置
# 用途：托管前端静态资源 + 反向代理 /api 到 Django（同域，保证 Session/CSRF 行为一致）。
# ⚠️ 本文件【未实际加载验证】；上线前请先执行 nginx -t。

upstream yishang_backend {
    server backend:8000;
    keepalive 16;
}

server {
    # 非特权 nginx 镜像监听 8080
    listen 8080;
    server_name _;

    charset utf-8;
    client_max_body_size 25m;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    # CSP 与后端 YISHANG_CSP_POLICY 保持一致；按实际需要收紧
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---------- 前端静态资源 ----------
    root /usr/share/nginx/html;
    index index.html;

    # 带指纹的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass http://yishang_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        # 不在代理层缓存业务接口
        proxy_buffering off;
    }

    # 健康检查（转发到后端）
    location = /healthz {
        proxy_pass http://yishang_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://yishang_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Django Admin 与静态资源（仅运维兜底使用）
    location /admin/ {
        proxy_pass http://yishang_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
    }

    # 附件：默认私有，必须经由后端权限校验，因此这里【不直接 alias 目录】，
    # 统一走 /api/v1/core/attachments/{id}/download/ 由后端鉴权后返回。
    location /media/ {
        return 404;
    }
}