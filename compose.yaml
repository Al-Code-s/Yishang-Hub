# 意尚智造集成平台 —— Docker Compose 编排
#
# ⚠️ 本文件已编写，但【未在本轮开发环境中实际启动验证】（本机 Docker 守护进程不可达）。
#    请在有 Docker 的机器上按 docs/deployment.md 第三节逐项验证后再用于生产。
#
# 约定：
#   * 同一后端镜像承担 backend / worker / beat 三种角色，仅启动命令不同；
#   * beat 只运行一个实例，避免重复生成业务单据；
#   * mysql / redis 不映射宿主端口，仅在内部网络可达；
#   * 迁移是独立的一次性发布步骤（migrate 服务），不由多个 Web 实例并发执行；
#   * 所有服务非 root 运行，配置健康检查与持久化卷。

name: yishang-platform

x-backend-env: &backend-env
  DJANGO_ENV: ${DJANGO_ENV:-production}
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?生产环境必须设置 DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?生产环境必须设置 DJANGO_ALLOWED_HOSTS}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?生产环境必须设置 DJANGO_CSRF_TRUSTED_ORIGINS}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
  # 内网纯 HTTP 部署（无证书）时可设 false；默认保持 true
  DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-true}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-2592000}
  DJANGO_USE_X_FORWARDED_FOR: "true"
  DB_DRIVER: mysqlclient
  DB_NAME: ${DB_NAME:-yishang_platform}
  DB_USER: ${DB_USER:-yishang_app}
  DB_PASSWORD: ${DB_PASSWORD:?生产环境必须设置 DB_PASSWORD}
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: django-db
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  YISHANG_BUSINESS_TIME_ZONE: ${YISHANG_BUSINESS_TIME_ZONE:-Asia/Shanghai}
  YISHANG_ATTACHMENT_ALLOWED_EXTENSIONS: ${YISHANG_ATTACHMENT_ALLOWED_EXTENSIONS:-.pdf,.png,.jpg,.jpeg,.webp,.xlsx,.xls,.csv,.docx,.txt,.zip}
  YISHANG_CSP_POLICY: ${YISHANG_CSP_POLICY:-default-src 'self'}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  mysql:
    # 版本基线：MySQL 8.0 系列（8.0 系列最新补丁，不钉死小版本）
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      # 下面三项与 deploy/mysql/my.cnf 对应：Windows 上宿主绑定挂载的配置文件被识别为
      # 0777（world-writable），MySQL 会打印 "World-writable config file ... is ignored" 并忽略它，
      # 因此容器内的权威配置是这里的 command 参数（my.cnf 在 Linux/macOS 宿主上仍会生效）。
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-expire-logs-seconds=604800
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-yishang_platform}
      MYSQL_USER: ${DB_USER:-yishang_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?必须设置 DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/my.cnf:/etc/mysql/conf.d/yishang.cnf:ro
    networks: [internal]
    # 不映射宿主端口：MySQL 不直接对外暴露
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "900", "1"]
    volumes:
      - redis-data:/data
    networks: [internal]
    # 不映射宿主端口：Redis 不直接对外暴露
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  object-storage:
    # 默认【不启动】：OBJECT_STORAGE_BUCKET 为空时附件走本地文件系统（backend-media 卷）。
    # 需要 S3 兼容对象存储时才启用：docker compose --profile object-storage up -d
    profiles: ["object-storage"]
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-yishang-minio}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?必须设置 OBJECT_STORAGE_SECRET_KEY}
    volumes:
      - object-storage-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # migrate 只声明 image、不写 build：同一个镜像 tag 只能有一个 build 目标。
  # 两个服务同时 build 同一个 tag 时，buildx bake 会并发导出同名镜像并报
  #   target backend: failed to solve: image "docker.io/library/yishang-platform-backend:local": already exists
  # 镜像由 backend 构建，运行顺序仍由 depends_on 保证（backend 等 migrate 跑完）。
  migrate:
    image: yishang-platform-backend:local
    restart: "no"
    environment: *backend-env
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    image: yishang-platform-backend:local
    restart: unless-stopped
    environment: *backend-env
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --timeout=60
      - --access-logfile=-
      - --error-logfile=-
    volumes:
      - backend-media:/app/media
      - backend-static:/app/staticfiles
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    image: yishang-platform-backend:local
    restart: unless-stopped
    environment: *backend-env
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - backend-media:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s

  # beat 只运行一个实例：多实例会导致调度任务重复生成业务单据
  beat:
    image: yishang-platform-backend:local
    restart: unless-stopped
    environment: *backend-env
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: yishang-platform-nginx:local
    restart: unless-stopped
    ports:
      # 宿主端口与监听地址都可配置（见 .env 的「对外访问」段）：
      # HTTP_BIND=0.0.0.0 表示局域网也能访问；改成 127.0.0.1 就只有本机能访问
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8080"
    volumes:
      - backend-media:/var/www/media:ro
      - backend-static:/var/www/static:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  internal:
    internal: true
  edge:

volumes:
  mysql-data:
  redis-data:
  object-storage-data:
  backend-media:
  backend-static: